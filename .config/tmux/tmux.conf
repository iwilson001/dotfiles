# open panes in current working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# start all windows and panes at 1 isntead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# window list top
set-option -g status-position top

# mouse support
set -g mouse on

set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
# status bar (colors from ghostty gruvbox dark soft)
set -g status-style "bg=#32302f,fg=#ebdbb2"
set -g status-left-length 50
set -g status-left "#[bg=#a89984,fg=#32302f,bold] #S #[default] "
set -g status-right ""
set -g window-status-separator ""
set -g window-status-format "#[bg=#3c3836,fg=#a89984] #I #W "
set -g window-status-current-format "#[bg=#fabd2f,fg=#32302f,bold] #I #W "

set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#fabd2f"
set -g message-style "bg=#3c3836,fg=#ebdbb2"
set -g mode-style "bg=#d65d0e,fg=#ebdbb2"

run '~/.tmux/plugins/tpm/tpm'

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection

# image preview support
set -gq allow-passthrough on
set -g visual-activity off

bind-key g display-popup \
  -E \
  -w 90% \
  -h 85% \
  -d "#{pane_current_path}" \
  lazygit
